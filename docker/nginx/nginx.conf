user nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Basic rate limit per IP (60 req/min) for /api endpoints.
  limit_req_zone $binary_remote_addr zone=api_rl:10m rate=60r/m;

  upstream backend_upstream {
    server backend:8000;
  }

  upstream frontend_upstream {
    server frontend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Health check passthrough.
    location = /healthz {
      proxy_pass http://backend_upstream/healthz;
    }

    # All API traffic.
    location /api/ {
      limit_req zone=api_rl burst=20 nodelay;

      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }

    # FastAPI Swagger UI / OpenAPI for admins.
    location ~ ^/(docs|redoc|openapi.json)$ {
      proxy_pass http://backend_upstream;
    }

    # Frontend (Next.js standalone) -- handles /, /consent, /case/*, /admin, etc.
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
