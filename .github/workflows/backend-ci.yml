# Backend: quality checks (lint / type / data validation) + pytest against SQLite and PostgreSQL
# Design: one quality-check job runs first; both pytest jobs depend on it (fail-fast on lint).

name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  quality-check:
    name: Quality checks (ruff, mypy, validate_data)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint check
        run: ruff check app
      - name: Ruff format check
        run: ruff format app --check
      - name: Mypy type check
        run: mypy app --ignore-missing-imports --no-site-packages
      - name: Validate data
        env:
          PYTHONIOENCODING: utf-8
        run: python -m app.scripts.validate_data

  pytest-sqlite:
    name: Pytest (SQLite) + coverage
    needs: quality-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Pytest with coverage
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=60

  pytest-postgres:
    name: Pytest (PostgreSQL 15)
    needs: quality-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medai_test"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/medai_test
      ADMIN_TOKEN: test-token
      LLM_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Pytest against PostgreSQL
        run: pytest -q
