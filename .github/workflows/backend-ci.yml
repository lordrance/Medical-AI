# 后端：SQLite 与 PostgreSQL 双跑 pytest（与生产 Docker 栈一致的数据库为 PG）

name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  pytest-sqlite:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Data integrity audit
        run: python -m app.scripts.data_integrity_audit

  pytest-postgres:
    name: pytest (PostgreSQL 15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medai_test"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/medai_test
      ADMIN_TOKEN: test-token
      LLM_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Pytest against PostgreSQL
        run: pytest -q
      - name: Data integrity audit
        run: python -m app.scripts.data_integrity_audit
