# Production docker-compose for short-term cloud deployment.
#
# Brings up postgres + backend + frontend + Caddy (auto-HTTPS reverse proxy)
# + nightly Postgres backup.
#
# Quickstart on the cloud server:
#   bash deploy/setup.sh
# which writes .env, then runs:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy terminates TLS automatically via Let's Encrypt using the domain
# you configured in deploy/Caddyfile (typically a free nip.io address like
# 43-155-12-34.nip.io that resolves to this server's public IP).

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medai}"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medai}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-medai}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?must set ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_DRY_RUN: ${LLM_DRY_RUN:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "true"
      APP_ENV: production
      # Audio files land here inside the container; we bind-mount the host
      # path below so they survive container rebuilds and can be backed up
      # without going through docker exec.
      VOICE_RECORDINGS_DIR: /app/data/voice_recordings
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./data/voice_recordings:/app/data/voice_recordings
    healthcheck:
      # GET (not HEAD) because /healthz only accepts GET — `wget --spider`
      # sends HEAD and the backend would return 405 Method Not Allowed,
      # forever marking the container unhealthy.
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: /api
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE: /api
    # service_started (not service_healthy): the frontend + Caddy must come up
    # and keep 80/443 listening even if the backend is briefly unhealthy (e.g.
    # a slow first-boot migration). Otherwise nothing listens on 80/443 and
    # users get "connection refused" — worse than a page that loads and shows a
    # retryable error. The frontend now tolerates a not-yet-ready API.
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Let's Encrypt certificates persist here
      - caddy_config:/config
    environment:
      # Resolved from .env. setup.sh writes this from the server IP.
      SITE_DOMAIN: ${SITE_DOMAIN:?must set SITE_DOMAIN (e.g. 43-155-12-34.nip.io)}
      # Optional email for Let's Encrypt account; can be left blank for ACME default.
      ACME_EMAIL: ${ACME_EMAIL:-}

  backup:
    image: postgres:15-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGUSER: ${POSTGRES_USER:-medai}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-medai}
    entrypoint: |
      /bin/sh -c '
      mkdir -p /backups
      while true; do
        ts=$$(date +%Y%m%d_%H%M%S)
        echo "[backup] running pg_dump at $$ts"
        pg_dump --format=custom --file="/backups/$$ts.dump" || echo "[backup] pg_dump failed"
        # keep newest 30
        ls -1t /backups/*.dump 2>/dev/null | tail -n +31 | xargs -r rm -f
        sleep ${BACKUP_INTERVAL_SECONDS:-86400}
      done
      '

volumes:
  pgdata:
  caddy_data:
  caddy_config:
